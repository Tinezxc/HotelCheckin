<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css"> 
    <link rel="stylesheet" href="css/register.css"> <!-- Reusing register CSS for the password meter -->
    
    <style>
        /* Small tweak to ensure it looks good in the login layout */
        .pw-help { margin-top: 10px; padding: 0; border: none; background: transparent; }
        .pw-help.open { padding: 12px 14px; border: 1px solid #e2e8f0; background: #f8fafc; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-side">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 12H5V22H19V12H22L12 2Z" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M9 22V16H15V22" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                <div class="logo-text">
                    <span class="logo-title">HAVEN</span>
                    <span class="logo-subtitle">A PLACE TO BELONG</span>
                </div>
            </div>

            <div class="login-card" id="loginCard">
                <div class="login-header">
                    <h1>New Password</h1>
                    <p>Please enter your new password below.</p>
                </div>

                <div class="alert alert-error" id="resetAlert" hidden role="alert"></div>
                <div class="alert alert-success" id="successAlert" hidden role="status">Password updated! Redirecting to login...</div>

                <form class="login-form" id="resetForm" novalidate>
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <div class="input-wrap">
                            <input type="password" id="new-password" placeholder="Create a strong password" required>
                            <button type="button" class="toggle-pw" data-target="new-password" aria-label="Show password" aria-pressed="false">
                                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                        <span class="error-msg" id="pwErr"></span>
                    </div>

                    <!-- Password Strength Meter (Same as Register) -->
                    <div class="pw-help" id="pwHelp">
                        <div class="pw-help-head">
                            <span class="pw-help-title">Password strength</span>
                            <small class="pw-label" id="pwStrength"></small>
                        </div>
                        <div class="pw-meter" id="pwMeter" data-level="0" aria-hidden="true"><span></span></div>
                        <ul class="pw-checklist">
                            <li data-rule="len">8+ characters</li>
                            <li data-rule="upper">Uppercase (A–Z)</li>
                            <li data-rule="lower">Lowercase (a–z)</li>
                            <li data-rule="number">Number (0–9)</li>
                            <li data-rule="special">Symbol (! @ # $)</li>
                            <li data-rule="nospace">No spaces</li>
                            <li data-rule="norepeat">No aaa or 111</li>
                            <li data-rule="common">Not common (qwerty)</li>
                        </ul>
                    </div>

                    <div class="form-group" style="margin-top: 20px;">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="input-wrap">
                            <input type="password" id="confirm-password" placeholder="Confirm new password" required>
                            <button type="button" class="toggle-pw" data-target="confirm-password" aria-label="Show password" aria-pressed="false">
                                <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            </button>
                        </div>
                        <span class="error-msg" id="confirmErr"></span>
                    </div>

                    <button type="submit" class="btn-signin" id="resetBtn">
                        <span class="btn-label">Update Password</span>
                        <span class="btn-spinner" hidden aria-label="Loading"></span>
                    </button>
                </form>
            </div>
        </div>
        <div class="image-side"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('resetForm');
            const resetAlert = document.getElementById('resetAlert');
            const successAlert = document.getElementById('successAlert');
            const resetBtn = document.getElementById('resetBtn');
            const passwordInput = document.getElementById('new-password');

            // 1. Check if there is an active session (from the email link)
            const { data: { session }, error } = await window.supabaseClient.auth.getSession();
            
            if (error || !session) {
                resetAlert.textContent = "Invalid or expired reset link. Please request a new one from the login page.";
                resetAlert.hidden = false;
                form.querySelector('button').disabled = true;
            }

            // 2. Toggle Password Visibility
            document.querySelectorAll('.toggle-pw').forEach((btn) => {
                const input = document.getElementById(btn.dataset.target);
                if (!input) return;
                btn.addEventListener('mousedown', (e) => e.preventDefault());
                btn.addEventListener('click', () => {
                    const show = input.type === 'password';
                    input.type = show ? 'text' : 'password';
                    btn.classList.toggle('is-visible', show);
                });
            });

            // 3. Password Strength Logic
            function getPasswordError(pw) {
                if (pw.length < 8)            return 'Password must be at least 8 characters.';
                if (/\s/.test(pw))            return 'Password cannot contain spaces.';
                if (!/[a-z]/.test(pw))        return 'Add at least one lowercase letter.';
                if (!/[A-Z]/.test(pw))        return 'Add at least one uppercase letter.';
                if (!/\d/.test(pw))           return 'Add at least one number.';
                if (!/[^A-Za-z0-9]/.test(pw)) return 'Add at least one special character (e.g. ! @ # $).';
                if (/(.)\1\1/.test(pw))       return 'Avoid repeating the same character 3 times in a row.';
                if (/password|qwerty|123456|abc123|letmein|admin/i.test(pw))
                                              return 'Password is too common. Choose something less predictable.';
                return '';
            }

            function getStrengthLevel(pw) {
                if (!pw) return 0;
                let score = 0;
                if (pw.length >= 8)  score++;
                if (pw.length >= 12) score++;
                if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
                if (/\d/.test(pw)) score++;
                if (/[^A-Za-z0-9]/.test(pw)) score++;
                if (getPasswordError(pw)) return Math.max(1, Math.min(score, 2));
                return score >= 5 ? 4 : 3;
            }

            const meter = document.getElementById('pwMeter');
            const meterLabel = document.getElementById('pwStrength');
            const strengthLabels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

            passwordInput.addEventListener('input', () => {
                const level = getStrengthLevel(passwordInput.value);
                meter.dataset.level = level;
                meterLabel.textContent = level ? strengthLabels[level] : '';
                updateChecklist(passwordInput.value);
            });

            const pwChecks = {
                len:      (pw) => pw.length >= 8,
                upper:    (pw) => /[A-Z]/.test(pw),
                lower:    (pw) => /[a-z]/.test(pw),
                number:   (pw) => /\d/.test(pw),
                special:  (pw) => /[^A-Za-z0-9\s]/.test(pw),
                nospace:  (pw) => !/\s/.test(pw),
                norepeat: (pw) => !/(.)\1\1/.test(pw),
                common:   (pw) => !/password|qwerty|123456|abc123|letmein|admin/i.test(pw)
            };

            function updateChecklist(pw) {
                document.querySelectorAll('.pw-checklist li').forEach((li) => {
                    const test = pwChecks[li.dataset.rule];
                    if (!test) return;
                    li.classList.toggle('met', !!pw && test(pw));
                    li.classList.toggle('unmet', !!pw && !test(pw));
                });
            }

            const pwHelp = document.getElementById('pwHelp');
            passwordInput.addEventListener('focus', () => pwHelp.classList.add('open'));
            passwordInput.addEventListener('blur', () => {
                if (!passwordInput.value) pwHelp.classList.remove('open');
            });

            // 4. Handle Form Submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                resetAlert.hidden = true;

                const pw = passwordInput.value;
                const confirmPw = document.getElementById('confirm-password').value;
                document.getElementById('pwErr').textContent = '';
                document.getElementById('confirmErr').textContent = '';

                // Use the same validation from registration
                const pwError = getPasswordError(pw);
                if (pwError) {
                    document.getElementById('pwErr').textContent = pwError;
                    return;
                }
                if (pw !== confirmPw) {
                    document.getElementById('confirmErr').textContent = "Passwords do not match.";
                    return;
                }

                const label = resetBtn.querySelector('.btn-label');
                const spinner = resetBtn.querySelector('.btn-spinner');
                resetBtn.disabled = true;
                label.hidden = true;
                spinner.hidden = false;

                // Update the password in Supabase
                const { error: updateError } = await window.supabaseClient.auth.updateUser({
                    password: pw
                });

                if (updateError) {
                    resetAlert.textContent = updateError.message;
                    resetAlert.hidden = false;
                    resetBtn.disabled = false;
                    label.hidden = false;
                    spinner.hidden = true;
                } else {
                    successAlert.hidden = false;
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>
