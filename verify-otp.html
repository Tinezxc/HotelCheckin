<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Haven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/verify-otp.css">
</head>
<body>

    <div class="otp-wrapper">
        <div class="otp-header">
            <h1>OTP Verification</h1>
        </div>

        <!-- State 1: Enter Code -->
        <div class="otp-card" id="otpCard">
            <div class="card-drag-handle"></div>
            
            <div class="otp-content" id="stepInput">
                <h2 class="otp-title">Verify your email</h2>
                <p class="otp-subtitle">Enter the 6-digit code we sent to <br><strong id="displayEmail">your email</strong>.</p>
                
                <form id="otpForm">
                    <div class="otp-inputs">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box" autofocus>
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
                        <input type="text" inputmode="numeric" maxlength="1" class="otp-box">
                    </div>
                    <span class="error-msg" id="otpError"></span>
                </form>
            </div>

            <!-- State 2: Success -->
            <div class="otp-content hidden" id="stepSuccess">
                <h2 class="otp-title">Email verified</h2>
                <p class="otp-subtitle">You're signed in on this device.</p>
                
                <div class="success-icon-wrap">
                    <div class="success-icon">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                </div>

                <button class="btn-continue" id="continueBtn">Continue to Login</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/verify-otp.js" defer></script>
</body>
</html>
